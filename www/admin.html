<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#160a25" />
  <title>Monetra · Administrador</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <link rel="stylesheet" href="theme.css?v=7" />
  <script src="vendor/chart.umd.min.js?v=7"></script>
  <script src="theme.js?v=7"></script>
  <style>
    body{display:block}.adm{max-width:1200px;margin:0 auto;padding:22px 18px 60px}
    .adm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .adm-top h1{margin:0;font-size:26px;display:flex;align-items:center;gap:12px}.adm-top img{width:38px;height:38px}
    .adm-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.adm-actions select{width:auto;min-height:40px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
    .kpi{background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:16px;position:relative;overflow:hidden}
    .kpi small{display:block;color:var(--muted);font-size:12px;letter-spacing:.6px;text-transform:uppercase}.kpi b{display:block;font-size:30px;margin-top:6px;font-variant-numeric:tabular-nums}
    .kpi::after{content:"";position:absolute;right:-30px;bottom:-40px;width:110px;height:110px;border-radius:50%;background:var(--rose);filter:blur(34px);opacity:.28}
    .kpi:nth-child(3n+2)::after{background:var(--sun)}.kpi:nth-child(3n)::after{background:var(--lilac)}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .box{position:relative;height:280px}.box.tall{height:320px}
    .note{padding:40px 20px;text-align:center}.note h2{margin-top:0}
    @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="adm">
  <div class="adm-top">
    <h1><img src="logo.png?v=7" alt="" /> <span>Panel de administrador</span></h1>
    <div class="adm-actions">
      <select id="range" aria-label="Periodo"><option value="7">Últimos 7 días</option><option value="30" selected>Últimos 30 días</option><option value="90">Últimos 90 días</option></select>
      <button type="button" id="reload" class="secondary sm">Actualizar</button>
      <button type="button" class="secondary theme-btn" data-theme-toggle aria-label="Modo claro / oscuro"><svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a href="app.html"><button type="button" class="sm">← Volver a la app</button></a>
    </div>
  </div>
  <div id="state" class="card note"><h2>Cargando…</h2></div>
  <div id="panel" class="hidden">
    <div class="kpis" id="kpis"></div>
    <div class="card"><h3>Visitas, visitantes y registros por día</h3><div class="box tall"><canvas id="cDaily"></canvas></div></div>
    <div class="grid2">
      <div class="card"><h3>Embudo de interés</h3><div class="box"><canvas id="cEvents"></canvas></div></div>
      <div class="card"><h3>Origen del registro</h3><div class="box"><canvas id="cProv"></canvas></div></div>
    </div>
    <div class="grid3">
      <div class="card"><h3>Idioma de los visitantes</h3><div class="box"><canvas id="cLang"></canvas></div></div>
      <div class="card"><h3>Dispositivo</h3><div class="box"><canvas id="cDev"></canvas></div></div>
      <div class="card"><h3>De dónde llegan</h3><div class="table-wrapper"><table style="min-width:0"><tbody id="tRef"></tbody></table></div></div>
    </div>
    <p class="muted">Las métricas son anónimas: no se guardan IP, cookies ni datos personales. Los usuarios y movimientos se cuentan solo en total.</p>
  </div>
</div>
<script src="vendor/supabase.js?v=7"></script>
<script src="config.js?v=7"></script>
<script src="data.js?v=7"></script>
<script src="admin.js?v=7"></script>
</body>
</html>
